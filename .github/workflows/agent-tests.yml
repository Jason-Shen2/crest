name: Agent Tests

# The agent runtime moved from Go (pkg/agent + pkg/aiusechat, deleted in
# 2994635c) to TypeScript packages plus Electron main-process integration,
# so this job runs the vitest suite that covers both sides.

on:
    pull_request:
        paths:
            - "emain/aiconfig/**"
            - "emain/aiconfig-ipc.ts"
            - "emain/agent-event-routing.ts"
            - "emain/agent-event-routing.test.ts"
            - "emain/agent-ipc.ts"
            - "emain/agent-ipc.test.ts"
            - "emain/agent-rewind*.ts"
            - "emain/agent-observability-ipc.ts"
            - "emain/agent-observability-ipc.test.ts"
            - "emain/agent-tools/**"
            - "emain/emain-ipc.ts"
            - "emain/models-dev-overlay.ts"
            - "emain/preload.ts"
            - "frontend/app/store/**"
            - "frontend/app/term/**"
            - "frontend/app/agent/**"
            - "frontend/app/observability/**"
            - "frontend/types/custom.d.ts"
            - "packages/agent/**"
            - "packages/ai/**"
            - "packages/boundary.test.ts"
            - "packages/coding-agent/**"
            - "electron.vite.config.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - "vitest.config.ts"
            - "vitest.slim.config.ts"
            - ".github/workflows/agent-tests.yml"
    push:
        branches:
            - main
            - "feat/**"

env:
    NODE_VERSION: 22

jobs:
    test:
        name: Linux full suite
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: npm ci
              run: npm ci --no-audit --no-fund

            - name: Run vitest
              run: npx vitest run

    workspace-rewind-posix:
        name: ${{ matrix.os }} (supported POSIX gate)
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: npm ci
              run: npm ci --no-audit --no-fund

            - name: Run focused workspace-rewind, coordinator, and UI gate
              run: >-
                  npx vitest run
                  packages/coding-agent/workspace-rewind
                  emain/agent-rewind-service.test.ts
                  emain/agent-rewind.e2e.test.ts
                  emain/agent-ipc.test.ts
                  frontend/app/agent/agent-content.test.tsx
                  frontend/app/agent/agent-chat-host.test.tsx

    workspace-rewind-windows-capability:
        name: windows-latest (explicit unsupported capability gate)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: npm ci
              run: npm ci --no-audit --no-fund

            - name: Run platform-neutral workspace-rewind contracts
              run: >-
                  npx vitest run
                  packages/coding-agent/workspace-rewind/api-validation.test.ts
                  packages/coding-agent/workspace-rewind/confirmation-token.test.ts
                  packages/coding-agent/workspace-rewind/path-codec.test.ts
                  packages/coding-agent/workspace-rewind/restore-plan.test.ts
                  packages/coding-agent/workspace-rewind/session-state.test.ts
                  packages/coding-agent/workspace-rewind/validation.test.ts

            - name: Assert Windows feature and reparse hard-blocks
              run: >-
                  npx vitest run
                  emain/agent-rewind.e2e.test.ts
                  -t "exposes the typed Windows rollout hard-block before inspect or apply"
