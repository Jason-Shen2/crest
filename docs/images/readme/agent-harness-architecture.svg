<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Crest Pi Agent Harness architecture</title>
  <desc id="desc">Editorial technical blueprint showing Crest-owned workspace and SQLite-backed .db session store around the in-tree Pi AgentHarness. Session .db files are the carrier; JSONL is only an import/export interchange format.</desc>
  <defs>
    <pattern id="minor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" class="grid-minor" fill="none"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor-grid)"/>
      <path d="M100 0H0V100" class="grid-major" fill="none"/>
    </pattern>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9Z" class="arrow-indigo"/>
    </marker>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9Z" class="arrow-neutral"/>
    </marker>
    <style>
      :root {
        --paper: #f4f1e9;
        --paper-raised: #fbf9f3;
        --ink: #17202a;
        --muted: #66707a;
        --rule: #aeb4b6;
        --rule-strong: #737c82;
        --grid-minor: #17202a0a;
        --grid-major: #17202a12;
        --indigo: #4658a8;
        --indigo-soft: #e5e8f5;
        --indigo-ink: #30418d;
        --focus: #1d2631;
        --focus-rule: #526071;
        --focus-ink: #f7f4ea;
        --focus-muted: #c3cbd4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #12171d;
          --paper-raised: #181e25;
          --ink: #edf0eb;
          --muted: #a3adb5;
          --rule: #47515b;
          --rule-strong: #73808a;
          --grid-minor: #edf0eb08;
          --grid-major: #edf0eb10;
          --indigo: #94a4f0;
          --indigo-soft: #242d4a;
          --indigo-ink: #bdc7ff;
          --focus: #e7e8e2;
          --focus-rule: #b7bcc0;
          --focus-ink: #17202a;
          --focus-muted: #4f5962;
        }
      }

      text {
        fill: var(--ink);
        text-rendering: geometricPrecision;
      }

      .canvas { fill: var(--paper); }
      .grid-minor { fill: none; stroke: var(--grid-minor); stroke-width: 1; }
      .grid-major { fill: none; stroke: var(--grid-major); stroke-width: 1; }
      .paper-card { fill: var(--paper-raised); stroke: var(--rule); stroke-width: 1.5; }
      .focus-card { fill: var(--focus); stroke: var(--focus-rule); stroke-width: 1.5; }
      .accent-rail { fill: var(--indigo); }
      .rule { stroke: var(--rule); stroke-width: 1.5; }
      .rule-strong { stroke: var(--rule-strong); stroke-width: 1.5; }
      .event-line {
        fill: none;
        stroke: var(--indigo);
        stroke-width: 3;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .neutral-line {
        fill: none;
        stroke: var(--rule-strong);
        stroke-width: 1.75;
        stroke-linecap: square;
      }
      .arrow-indigo { fill: var(--indigo); }
      .arrow-neutral { fill: var(--rule-strong); }
      .eyebrow,
      .section-label,
      .stage-number,
      .owner-label,
      .flow-label,
      .legend-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .eyebrow { font-size: 22px; font-weight: 700; fill: var(--indigo-ink); }
      .title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 54px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .subtitle {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        fill: var(--muted);
      }
      .section-label { font-size: 22px; font-weight: 700; fill: var(--muted); }
      .card-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 29px;
        font-weight: 600;
      }
      .card-body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        fill: var(--muted);
      }
      .owner-label { font-size: 22px; font-weight: 700; fill: var(--indigo-ink); }
      .focus-title { fill: var(--focus-ink); font-size: 32px; }
      .focus-body { fill: var(--focus-muted); font-size: 22px; }
      .focus-owner { fill: var(--focus-muted); }
      .foundation-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 22px;
        font-weight: 700;
      }
      .foundation-body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        fill: var(--muted);
      }
      .stage-number { font-size: 22px; font-weight: 700; fill: var(--indigo-ink); }
      .stage-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 600;
      }
      .stage-body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        fill: var(--muted);
      }
      .flow-label { font-size: 22px; font-weight: 700; fill: var(--indigo-ink); }
      .legend-label { font-size: 22px; font-weight: 700; fill: var(--muted); }
      .legend-text {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        fill: var(--ink);
      }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000"/>
  <rect width="1600" height="1000" fill="url(#major-grid)"/>

  <g aria-label="Diagram heading">
    <text x="80" y="67" class="eyebrow">Crest systems note / 01</text>
    <text x="80" y="128" class="title">Inside the Pi Agent Harness</text>
    <text x="80" y="169" class="subtitle">Crest owns the workspace and .db session store; Pi drives the stateful loop.</text>
    <path d="M80 194H1520" class="rule-strong"/>
  </g>

  <g aria-label="System layers">
    <text x="80" y="229" class="section-label">A / System layers &amp; ownership</text>

    <g aria-label="Agent Workspace UI">
      <rect x="80" y="252" width="650" height="112" rx="2" class="paper-card"/>
      <rect x="80" y="252" width="7" height="112" class="accent-rail"/>
      <text x="108" y="281" class="owner-label">Crest / UI</text>
      <text x="108" y="319" class="card-title">Agent Workspace UI</text>
      <text x="108" y="346" class="card-body">assistant-ui · usePiChat · live tool state</text>
    </g>

    <path d="M405 364V389" class="neutral-line" marker-end="url(#arrow-neutral)"/>
    <text x="425" y="382" class="flow-label">preload / IPC</text>

    <g aria-label="Crest Session Owner and IPC">
      <rect x="80" y="398" width="650" height="138" rx="2" class="paper-card"/>
      <rect x="80" y="398" width="7" height="138" class="accent-rail"/>
      <text x="108" y="427" class="owner-label">Crest / Main</text>
      <text x="108" y="465" class="card-title">Session Owner + IPC</text>
      <text x="108" y="499" class="card-body">PaneAgentSession · agent:event · authoritative state</text>
    </g>

    <path d="M405 536V561" class="event-line" marker-end="url(#arrow-indigo)"/>
    <text x="425" y="555" class="flow-label">typed events</text>

    <g aria-label="Pi AgentHarness">
      <rect x="80" y="570" width="650" height="154" rx="2" class="focus-card"/>
      <text x="108" y="600" class="owner-label focus-owner">Pi / In-tree</text>
      <text x="108" y="644" class="card-title focus-title">Pi AgentHarness</text>
      <text x="108" y="681" class="card-body focus-body">Stateful loop · typed events · queues · compaction</text>
      <path d="M690 595V699" stroke="var(--focus-rule)" stroke-width="1.5"/>
      <circle cx="690" cy="582" r="4" fill="var(--indigo)"/>
      <circle cx="690" cy="712" r="4" fill="var(--indigo)"/>
    </g>

    <path d="M405 724V749" class="neutral-line" marker-end="url(#arrow-neutral)"/>
    <text x="425" y="743" class="flow-label">runtime calls</text>

    <g aria-label="Runtime foundations">
      <rect x="80" y="758" width="198" height="96" rx="2" class="paper-card"/>
      <text x="98" y="786" class="owner-label">Pi / AI</text>
      <text x="98" y="815" class="foundation-title">AI streaming</text>
      <text x="98" y="841" class="foundation-body">Provider stream</text>

      <rect x="296" y="758" width="198" height="96" rx="2" class="paper-card"/>
      <rect x="296" y="758" width="5" height="96" class="accent-rail"/>
      <text x="314" y="786" class="owner-label">Crest</text>
      <text x="314" y="815" class="foundation-title">AI Tools</text>
      <text x="314" y="841" class="foundation-body">Project actions</text>

      <rect x="512" y="758" width="218" height="96" rx="2" class="paper-card"/>
      <rect x="512" y="758" width="5" height="96" class="accent-rail"/>
      <text x="530" y="786" class="owner-label">Crest</text>
      <text x="530" y="815" class="foundation-title">Session store</text>
      <text x="530" y="841" class="foundation-body">.db session tree</text>
    </g>
  </g>

  <path d="M770 216V866" class="rule"/>

  <g aria-label="Continuous turn event loop">
    <text x="810" y="229" class="section-label">B / Continuous turn event loop</text>

    <g aria-label="Context snapshot">
      <rect x="850" y="262" width="590" height="96" rx="2" class="paper-card"/>
      <rect x="850" y="262" width="7" height="96" class="accent-rail"/>
      <text x="879" y="294" class="stage-number">CONTEXT</text>
      <text x="1010" y="299" class="stage-title">Assemble a live snapshot</text>
      <text x="879" y="334" class="stage-body">cwd · instructions · history · tools</text>
    </g>

    <path d="M1145 358V389" class="event-line" marker-end="url(#arrow-indigo)"/>

    <g aria-label="Model and tool cycle">
      <rect x="820" y="400" width="660" height="238" rx="2" class="paper-card"/>
      <text x="850" y="432" class="flow-label">repeat while tools are requested</text>

      <rect x="850" y="458" width="250" height="132" rx="2" class="paper-card"/>
      <rect x="850" y="458" width="7" height="132" class="accent-rail"/>
      <text x="879" y="492" class="stage-number">MODEL</text>
      <text x="879" y="530" class="stage-title">Stream response</text>
      <text x="879" y="562" class="stage-body">text · tool calls</text>

      <rect x="1200" y="458" width="250" height="132" rx="2" class="paper-card"/>
      <rect x="1200" y="458" width="7" height="132" class="accent-rail"/>
      <text x="1229" y="492" class="stage-number">TOOLS</text>
      <text x="1229" y="530" class="stage-title">Execute calls</text>
      <text x="1229" y="562" class="stage-body">hooks · typed results</text>

      <path d="M1100 500H1191" class="event-line" marker-end="url(#arrow-indigo)"/>
      <text x="1145" y="486" class="flow-label" text-anchor="middle">call</text>
      <path d="M1260 590V620H975V599" class="event-line" marker-end="url(#arrow-indigo)"/>
      <rect x="990" y="591" width="288" height="30" fill="var(--paper-raised)"/>
      <text x="1120" y="612" class="flow-label" text-anchor="middle">result → next model step</text>
    </g>

    <g aria-label="Continuous message persistence">
      <rect x="850" y="670" width="590" height="82" rx="2" class="paper-card"/>
      <rect x="850" y="670" width="7" height="82" class="accent-rail"/>
      <text x="879" y="702" class="stage-number">MESSAGE_END</text>
      <text x="1090" y="706" class="stage-title">Append session entry</text>
      <text x="879" y="735" class="stage-body">Completed message and tool-result entries</text>
      <path d="M900 590V661" class="event-line" marker-end="url(#arrow-indigo)"/>
      <path d="M1375 590V661" class="event-line" marker-end="url(#arrow-indigo)"/>
    </g>

    <g aria-label="Live reflection and resume">
      <rect x="850" y="784" width="590" height="82" rx="2" class="paper-card"/>
      <text x="879" y="817" class="stage-number">EVENTS</text>
      <text x="1000" y="821" class="stage-title">Mirror now · resume branch</text>
      <text x="879" y="850" class="stage-body">Live events stream; session store rebuilds branch</text>
      <path d="M1145 752V775" class="event-line" marker-end="url(#arrow-indigo)"/>
    </g>
  </g>

  <g aria-label="Legend">
    <path d="M80 894H1520" class="rule-strong"/>
    <text x="80" y="930" class="legend-label">Legend</text>

    <rect x="198" y="909" width="42" height="28" rx="1" class="paper-card"/>
    <rect x="198" y="909" width="5" height="28" class="accent-rail"/>
    <text x="254" y="930" class="legend-text">Crest-owned integration</text>

    <rect x="548" y="909" width="42" height="28" rx="1" class="focus-card"/>
    <text x="604" y="930" class="legend-text">Pi adapted in-tree</text>

    <path d="M843 923H897" class="event-line" marker-end="url(#arrow-indigo)"/>
    <text x="917" y="930" class="legend-text">Stateful event path</text>

    <text x="1520" y="930" class="legend-label" text-anchor="end">1600 × 1000 / Theme aware</text>
  </g>
</svg>
